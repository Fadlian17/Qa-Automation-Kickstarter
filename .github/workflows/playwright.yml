name: QA Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: 'Cakupan test yang dijalankan'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - smoke
          - regression
          - api
          - backoffice
          - app
      test_env:
        description: 'Environment target (base URL dari config/)'
        required: true
        default: 'local'
        type: choice
        options:
          - local
          - dev
          - staging

concurrency:
  group: qa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        env:
          TEST_ENV: ${{ inputs.test_env || 'local' }}
        run: |
          SCOPE="${{ inputs.scope || 'full' }}"
          case "$SCOPE" in
            smoke)      COMMAND="npm run test:smoke" ;;
            regression) COMMAND="npm run test:regression" ;;
            api)        COMMAND="npm run test:api" ;;
            backoffice) COMMAND="npm run test:backoffice" ;;
            app)        COMMAND="npm run test:app" ;;
            full)       COMMAND="npm test" ;;
            *)          COMMAND="npm test" ;;
          esac
          echo "::group::Running: $COMMAND (TEST_ENV=$TEST_ENV)"
          $COMMAND
          echo "::endgroup::"

      - name: Generate PDF rekap report
        if: always()
        run: npm run report:pdf

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results -o allure-report

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload test-results (report.json + PDF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## QA Automation Run"
            echo ""
            echo "Scope: \`${{ inputs.scope || 'full' }}\` | TEST_ENV: \`${{ inputs.test_env || 'local' }}\`"
            echo ""
            echo "Artifacts: **playwright-report**, **allure-report**, **allure-results**, **test-results** (report.json + PDF rekap)"
            echo ""
            echo "PDF rekap tersimpan di: \`test-results/pdf/\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    name: Deploy Allure Report to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Allure raw results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: .

      - name: Generate Allure report
        run: npx allure generate allure-results -o allure-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
